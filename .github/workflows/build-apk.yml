# Every change pushed to main builds the app and publishes it as the latest release.
# The app on the TV checks the latest release and offers "Update available".
name: Build APK
on:
  push:
    branches: [main, feature/debrid-search]
    paths-ignore: ['README.md', 'design/**', 'tools/shoot.py', 'tools/bridge_test.py', 'mac/**', '.github/workflows/build-mac.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }

      - name: Build the TV interface
        run: npm ci && npm test && bash tools/build-web.sh

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Check TV navigation in Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tools/test-navigation.py

      - name: Compile the minified app and playback test package
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon -PtorrentAbi=x86_64 -PtestVariant=release assembleRelease assembleReleaseAndroidTest

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download pinned VLC for real playback verification
        run: |
          curl --fail --location --retry 3 https://download.videolan.org/pub/videolan/vlc-android/3.6.5/VLC-Android-3.6.5-x86_64.apk -o /tmp/lumen-vlc-test.apk
          echo 'd7049239374c91c11b143bb517fcd8210b85281480d903087cac90ebbab09ec2  /tmp/lumen-vlc-test.apk' | sha256sum --check

      - name: Check minified release playback in installed VLC and Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: bash ../tools/test-android-vlc.sh

      - name: Restore the signing key (private repository secret)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The original Lumen signing secrets are required. Refusing to publish a temporary-key update."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/lumen.jks
          chmod 600 android/app/lumen.jks

      - name: Build the APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../build/apks
          chmod +x gradlew
          ./gradlew --no-daemon -PtorrentAbi=armeabi-v7a assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../build/apks/app-release.apk
          ./gradlew --no-daemon -PtorrentAbi=arm64-v8a assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../build/apks/app-arm64.apk

      - name: Verify update signature
        env:
          EXPECTED_CERT_SHA256: 2a12c7713f69a1178ebd87303cb14ed0dc2f0d1fafd28d0676355dc93aa236b7
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in build/apks/*.apk; do
            "$APKSIGNER" verify "$apk"
            keytool -J-Duser.language=en -printcert -jarfile "$apk" > /tmp/lumen-signature.txt
            python3 - <<'PYVERIFY'
          import os, re
          text = open('/tmp/lumen-signature.txt').read()
          digest = re.search(r'SHA256:\s*([0-9a-fA-F:]+)', text)
          assert digest and digest[1].replace(':', '').lower() == os.environ['EXPECTED_CERT_SHA256'], 'APK must retain the installed signing certificate'
          print('APK signature matches installed Lumen.')
          PYVERIFY
          done

      - name: Check update identity and version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          export AAPT
          python3 - <<'PYVERIFY'
          import os, re, subprocess, zipfile
          for name,abi,limit in [('app-release.apk','armeabi-v7a',6200000),('app-arm64.apk','arm64-v8a',7200000)]:
              path='build/apks/'+name
              text=subprocess.check_output([os.environ['AAPT'],'dump','badging',path],text=True)
              package=re.search(r"package: name='([^']+)' versionCode='(\d+)'",text)
              assert package and package[1]=='tv.lumen.app' and int(package[2])==int(os.environ['BUILD_NUMBER']) and int(package[2])>60
              assert os.path.getsize(path)<limit, 'APK size budget exceeded: '+name
              with zipfile.ZipFile(path) as apk:
                  libraries=[n for n in apk.namelist() if n.endswith('/libjlibtorrent.so')]
                  assert libraries==['lib/'+abi+'/libjlibtorrent.so'], 'APK must contain exactly its target architecture'
              print(name,abi,os.path.getsize(path),'bytes')
          PYVERIFY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumen-build-${{ github.run_number }}
          path: |
            build/apks/*.apk
            build/vlc-shots/
            build/navigation-shots/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${{ github.run_number }}" build/apks/app-release.apk \
            --title "Lumen TV build ${{ github.run_number }}" \
            --notes "${NOTES:-Manual build}" --draft
          gh release upload "build-${{ github.run_number }}" build/apks/app-arm64.apk
          gh release edit "build-${{ github.run_number }}" --draft=false --latest
