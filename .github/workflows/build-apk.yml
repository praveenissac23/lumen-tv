name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q lumen-tv.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the TV interface
        working-directory: lumen-tv
        run: npm ci && bash tools/build-web.sh
      - name: Build the APK
        working-directory: lumen-tv/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-tv-apk
          path: lumen-tv/android/app/build/outputs/apk/release/*.apk
